<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>Сбор Пэпе на ПК · 70 000 ₽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070b;
    --text:#f3f4f8;
    --muted:#8d91a8;
    --stroke:rgba(255,255,255,.09);
    --radius:28px;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg .blob{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform}
  .b1{width:560px;height:560px;background:#5b3bff;top:-190px;left:-150px;opacity:.55;animation:float1 20s ease-in-out infinite}
  .b2{width:520px;height:520px;background:#0090ff;bottom:-220px;right:-160px;opacity:.42;animation:float2 24s ease-in-out infinite}
  .b3{width:420px;height:420px;background:#ff2fa0;top:42%;left:58%;opacity:.22;animation:float3 28s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,60px) scale(1.12)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-50px) scale(1.1)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,50px) scale(1.15)}}

  .bg .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:70px 70px;
    -webkit-mask-image:radial-gradient(ellipse 95% 65% at 50% 0%, #000 10%, transparent 72%);
    mask-image:radial-gradient(ellipse 95% 65% at 50% 0%, #000 10%, transparent 72%);
    opacity:.75;
  }
  .bg .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, transparent 38%, rgba(7,7,11,.8) 100%)}

  /* ---------- LAYOUT ---------- */
  .wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:22px 20px 70px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:clamp(30px,6vw,54px)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{
    width:44px;height:44px;border-radius:14px;flex:0 0 auto;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#7b5cff,#21d4fd);
    box-shadow:0 10px 28px -6px rgba(123,92,255,.7), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand-mark svg{width:22px;height:22px}
  .brand-name{font-weight:800;font-size:15.5px;letter-spacing:-.02em;line-height:1.15}
  .brand-sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}

  /* ---------- HERO ---------- */
  .hero{text-align:center;margin-bottom:clamp(26px,5vw,42px)}
  .badge{
    display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;
    font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
    color:#c3b8ff;background:rgba(123,92,255,.11);border:1px solid rgba(123,92,255,.3);
    margin-bottom:20px;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:#9d86ff;display:block}
  .hero h1{
    font-size:clamp(32px,7.4vw,60px);
    font-weight:800;letter-spacing:-.038em;line-height:1.04;margin-bottom:15px;
  }
  .hero h1 .grad{
    background:linear-gradient(100deg,#cbbcff 0%,#7b5cff 32%,#21d4fd 68%,#6dffd0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--muted);font-size:clamp(13.5px,2.7vw,16.5px);max-width:540px;margin:0 auto;line-height:1.6;font-weight:500}

  /* ---------- CARD ---------- */
  .card{
    position:relative;border-radius:var(--radius);
    padding:clamp(20px,4.6vw,38px);
    background:linear-gradient(180deg, rgba(255,255,255,.062), rgba(255,255,255,.017));
    border:1px solid rgba(255,255,255,.085);
    box-shadow:0 40px 90px -40px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.075);
    backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(620px 220px at 50% -30%, rgba(123,92,255,.22), transparent 70%);
  }
  .card.done{border-color:rgba(109,255,208,.35);box-shadow:0 40px 90px -40px rgba(0,0,0,.95), 0 0 60px -20px rgba(109,255,208,.35), inset 0 1px 0 rgba(255,255,255,.1)}
  .card.done::before{background:radial-gradient(620px 220px at 50% -30%, rgba(109,255,208,.22), transparent 70%)}

  .amounts{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px;flex-wrap:wrap}
  .amounts .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px}
  .value{
    font-size:clamp(38px,8.4vw,64px);font-weight:800;letter-spacing:-.045em;line-height:.95;
    font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;
  }
  .value .cur{font-size:.42em;font-weight:800;color:#9aa0b8}
  .goal-block{text-align:right;flex:0 0 auto}
  .goal-block .value{font-size:clamp(22px,4.8vw,30px);color:#d3d7e6;letter-spacing:-.03em}
  .goal-block .value .cur{color:#7d8299}

  /* ---------- PROGRESS ---------- */
  .track{
    position:relative;height:clamp(22px,4.8vw,28px);border-radius:999px;
    background:rgba(255,255,255,.055);padding:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 2px 10px rgba(0,0,0,.4);
  }
  .fill{
    position:relative;height:100%;width:0%;border-radius:999px;overflow:hidden;
    background:linear-gradient(90deg,#7b5cff 0%,#4f8bff 34%,#21d4fd 68%,#6dffd0 100%);
    box-shadow:0 0 20px rgba(79,139,255,.6), 0 0 46px rgba(33,212,253,.3);
    transition:width 1.15s cubic-bezier(.22,1,.36,1);
  }
  .fill::after{
    content:'';position:absolute;top:0;bottom:0;width:48%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:shine 3s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-65%}55%,100%{left:135%}}
  .ticks{position:absolute;inset:4px;pointer-events:none}
  .ticks i{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:9px;border-radius:2px;background:rgba(0,0,0,.26)}

  .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  .pct-badge{
    display:inline-flex;align-items:center;gap:4px;padding:8px 15px;border-radius:999px;
    border:1px solid rgba(123,92,255,.32);background:rgba(123,92,255,.12);
    font-size:13px;font-weight:800;color:#cfc4ff;letter-spacing:-.01em;
  }
  .pct-badge b{font-size:15px}

  .remain-box{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;border-radius:16px;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);
  }
  .remain-box .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .remain-box .v{font-size:clamp(15px,3.8vw,19px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#e9ebf5;white-space:nowrap}
  .remain-box .v.done{color:#6dffd0}

  /* ---------- FOOTER ---------- */
  .footer{text-align:center;margin-top:34px;font-size:11.5px;color:#54586b;font-weight:600;line-height:1.8}

  /* ---------- FX ---------- */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999;display:none}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }

  @media(max-width:520px){
    .wrap{padding:18px 14px 60px}
    .brand-sub{display:none}
    .goal-block{text-align:left}
    .amounts{gap:14px}
    .meta{gap:10px}
  }
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
</div>

<canvas id="fx"></canvas>

<main class="wrap">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3.5" width="20" height="13.5" rx="2.5"/>
          <path d="M8 21h8M12 17.5V21"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Пэпе · PC Build</div>
        <div class="brand-sub">Личный сбор на компьютер</div>
      </div>
    </div>
  </div>

  <!-- HERO -->
  <header class="hero">
    <div class="badge"><i></i> Сбор открыт · цель 70 000 ₽</div>
    <h1>Сбор Пэпе <span class="grad">на ПК</span></h1>
    <p>Каждый вклад — это ещё один шаг к заветной сборке. Спасибо всем, кто помогает приблизить цель 💜</p>
  </header>

  <!-- MAIN CARD -->
  <section class="card" id="card">
    <div class="amounts">
      <div>
        <div class="label">Собрано</div>
        <div class="value"><span id="collected">0</span><span class="cur">₽</span></div>
      </div>
      <div class="goal-block">
        <div class="label">Цель</div>
        <div class="value"><span id="goalValue">70 000</span><span class="cur">₽</span></div>
      </div>
    </div>

    <div class="track">
      <div class="fill" id="fill"></div>
      <div class="ticks">
        <i style="left:25%"></i>
        <i style="left:50%"></i>
        <i style="left:75%"></i>
      </div>
    </div>

    <div class="meta">
      <span class="pct-badge"><b id="pct">0</b>%</span>
      <div class="remain-box">
        <span class="k">До цели</span>
        <span class="v" id="remain">70 000 ₽</span>
      </div>
    </div>
  </section>

  <div class="footer">Сделано с любовью к железу</div>

</main>

<script>
(function(){
  'use strict';

  /* ╔══════════════════════════════════════════════════════════╗
     ║                                                          ║
     ║   ⚙️  МЕНЯЙТЕ СУММУ ЗДЕСЬ  ⚙️                            ║
     ║                                                          ║
     ║   COLLECTED — сколько уже собрано (в рублях).            ║
     ║   Просто впишите число, сохраните файл и обновите        ║
     ║   страницу — всё пересчитается автоматически.            ║
     ║                                                          ║
     ║   Примеры:                                               ║
     ║     COLLECTED: 0        →   0 ₽   (0%)                   ║
     ║     COLLECTED: 12500    →   12 500 ₽                     ║
     ║     COLLECTED: 70000    →   цель достигнута 🎉           ║
     ║                                                          ║
     ╚══════════════════════════════════════════════════════════╝ */

  const CONFIG = {
    COLLECTED: 24000,       // ← ИЗМЕНИТЕ ЭТО ЧИСЛО
    GOAL:      70000    // ← цель сбора (можно тоже менять)
  };

  /* ═══════════════════════════════════════════════════════════
     Дальше идёт логика — трогать не нужно
     ═══════════════════════════════════════════════════════════ */

  const nf = new Intl.NumberFormat('ru-RU');
  const fmt = n => nf.format(Math.round(n));
  const fmtMoney = n => fmt(n) + ' ₽';

  const $ = id => document.getElementById(id);
  const elCollected = $('collected');
  const elGoalValue = $('goalValue');
  const elFill      = $('fill');
  const elPct       = $('pct');
  const elRemain    = $('remain');
  const elCard      = $('card');

  const total = Math.max(0, Number(CONFIG.COLLECTED) || 0);
  const goal  = Math.max(1, Number(CONFIG.GOAL) || 70000);

  const rawPct = (total / goal) * 100;
  const pct    = Math.min(100, rawPct);
  const left   = Math.max(0, goal - total);
  const done   = total >= goal;

  /* ---------- цель в шапке карточки ---------- */
  elGoalValue.textContent = fmt(goal);

  /* ---------- значение "собрано" с плавной анимацией ---------- */
  function animateValue(el, from, to, dur){
    const start = performance.now();
    if(from === to){ el.textContent = fmt(to); return; }
    function tick(now){
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (to - from) * e);
      if(p < 1) requestAnimationFrame(tick);
      else el.textContent = fmt(to);
    }
    requestAnimationFrame(tick);
  }
  animateValue(elCollected, 0, total, 1200);

  /* ---------- прогресс ---------- */
  requestAnimationFrame(function(){
    elFill.style.width = pct + '%';
  });

  elPct.textContent = Math.min(100, Math.floor(rawPct));

  if(done){
    elRemain.textContent = '🎉 Цель достигнута!';
    elRemain.classList.add('done');
  }else{
    elRemain.textContent = fmtMoney(left);
  }

  elCard.classList.toggle('done', done);

  /* ---------- праздничное конфетти при достижении цели ---------- */
  if(done) setTimeout(burstConfetti, 700);

  function burstConfetti(){
    const cv = document.getElementById('fx');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth;
    const H = window.innerHeight;

    cv.width = W * dpr;
    cv.height = H * dpr;
    cv.style.display = 'block';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#7b5cff','#21d4fd','#6dffd0','#ff4ecd','#ffd166','#ffffff'];
    const parts = [];
    for(let i = 0; i < 190; i++){
      parts.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.6,
        y: H * 0.32 + (Math.random() - 0.5) * 120,
        vx: (Math.random() - 0.5) * 15,
        vy: Math.random() * -15 - 4,
        w: 5 + Math.random() * 8,
        h: 8 + Math.random() * 10,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.32,
        color: colors[(Math.random() * colors.length) | 0]
      });
    }

    const t0 = performance.now();
    let last = t0;

    function frame(now){
      const dt = Math.min(34, now - last);
      last = now;
      const k = dt / 16.67;

      ctx.clearRect(0, 0, W, H);
      const alpha = Math.max(0, 1 - (now - t0) / 3400);
      let alive = false;

      for(let i = 0; i < parts.length; i++){
        const p = parts[i];
        p.vy += 0.36 * k;
        p.vx *= 0.995;
        p.x += p.vx * k;
        p.y += p.vy * k;
        p.rot += p.vr * k;

        if(p.y < H + 80) alive = true;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      if(alive && now - t0 < 3800){
        requestAnimationFrame(frame);
      }else{
        ctx.clearRect(0, 0, W, H);
        cv.style.display = 'none';
      }
    }
    requestAnimationFrame(frame);
  }

})();
</script>
</body>
</html>
